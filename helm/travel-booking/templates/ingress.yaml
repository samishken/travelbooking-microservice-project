apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-booking-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName }}
    # Evaluated after other Ingresses in the group (e.g. /jenkins) since "/" catches everything
    alb.ingress.kubernetes.io/group.order: "100"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    {{- with .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ . }}
    {{- end }}
    alb.ingress.kubernetes.io/ssl-redirect: "443"

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.frontend.servicename }}
                port:
                  number: 80

          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.userService.servicename }}
                port:
                  number: 3001

          - path: /api/search
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.searchService.servicename }}
                port:
                  number: 3002

          - path: /api/bookings
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.bookingService.servicename }}
                port:
                  number: 3003

          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.paymentService.servicename }}
                port:
                  number: 3004

          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.notificationService.servicename }}
                port:
                  number: 3005
    {{- end }}
