# Lets Jenkins agent pods (service account jenkins/cd-jenkins) deploy the
# travel-booking Helm release. Scoped to the travel-booking namespace, which
# is created here (the pipeline does not create namespaces), plus read access
# to namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: travel-booking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: travel-booking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: cd-jenkins
    namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins-namespace-reader
subjects:
  - kind: ServiceAccount
    name: cd-jenkins
    namespace: jenkins
