# kube-prometheus-stack Helm values

# ==============================================================================
# Default Rules
# ==============================================================================
defaultRules:
  create: true

# ==============================================================================
# Prometheus Operator
# ==============================================================================
prometheusOperator:
  admissionWebhooks:
    enabled: true

# ==============================================================================
# Prometheus
# ==============================================================================
prometheus:
  service:
    type: ClusterIP

  prometheusSpec:
    retention: 15d

    externalUrl: https://weyewweyew.com/prometheus
    routePrefix: /prometheus

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

# ==============================================================================
# Grafana
# ==============================================================================
grafana:
  enabled: true

  # Admin credentials come from the "grafana-admin" Secret (see monitoring.md)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  grafana.ini:
    server:
      root_url: https://weyewweyew.com/grafana
      serve_from_sub_path: true

  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

  service:
    type: ClusterIP

  # Metrics move under the sub-path with serve_from_sub_path
  serviceMonitor:
    path: /grafana/metrics

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

    datasources:
      enabled: true

# ==============================================================================
# Alertmanager
# ==============================================================================
alertmanager:
  service:
    type: ClusterIP

  alertmanagerSpec:
    externalUrl: https://weyewweyew.com/alertmanager
    routePrefix: /alertmanager

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

# ==============================================================================
# Node Exporter
# ==============================================================================
nodeExporter:
  enabled: true

# ==============================================================================
# kube-state-metrics
# ==============================================================================
kubeStateMetrics:
  enabled: true

# ==============================================================================
# Kubelet Metrics
# ==============================================================================
kubelet:
  enabled: true

  serviceMonitor:
    enabled: true
    cAdvisor: true
