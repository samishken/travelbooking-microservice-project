# Apply with your allowed source range substituted, e.g.:
#   ALLOWED_CIDR="$(curl -s https://checkip.amazonaws.com)/32" \
#     envsubst < monitoring/ingress.yaml | kubectl apply -f -
#
# The source-ip conditions are per listener rule, so only these routes are
# restricted; requests from other IPs fall through to the app's "/" rule.
# (inbound-cidrs would restrict the whole shared ALB, including the app.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    alb.ingress.kubernetes.io/group.name: travel-booking
    # Evaluated before the app's "/" catch-all (order 100)
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Grafana/Prometheus/Alertmanager redirect "/" to their sub-path
    alb.ingress.kubernetes.io/success-codes: 200-399
    alb.ingress.kubernetes.io/conditions.kube-prometheus-stack-grafana: '[{"field":"source-ip","sourceIpConfig":{"values":["${ALLOWED_CIDR}"]}}]'
    alb.ingress.kubernetes.io/conditions.kube-prometheus-stack-prometheus: '[{"field":"source-ip","sourceIpConfig":{"values":["${ALLOWED_CIDR}"]}}]'
    alb.ingress.kubernetes.io/conditions.kube-prometheus-stack-alertmanager: '[{"field":"source-ip","sourceIpConfig":{"values":["${ALLOWED_CIDR}"]}}]'

spec:
  ingressClassName: alb

  # Served under sub-paths (see routePrefix / root_url in helm/values.yaml);
  # the ACM certificate is discovered from the host
  rules:
  - host: weyewweyew.com
    http:
      paths:
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: kube-prometheus-stack-grafana
            port:
              number: 80

      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: kube-prometheus-stack-prometheus
            port:
              number: 9090

      - path: /alertmanager
        pathType: Prefix
        backend:
          service:
            name: kube-prometheus-stack-alertmanager
            port:
              number: 9093
